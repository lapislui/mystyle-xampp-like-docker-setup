# Per-project vhosts generated by stack.sh (for document roots such as Moodle's public/).
# Included before the wildcard vhost so exact hostnames win.
IncludeOptional /etc/apache2/stack-vhosts/*.conf

<VirtualHost *:80>
    ServerName projects.localhost
    ServerAlias *.localhost
    UseCanonicalName Off
    VirtualDocumentRoot /var/www/html/%1

    DirectoryIndex index.php index.html index.htm

    ErrorLog ${APACHE_LOG_DIR}/projects-error.log
    CustomLog ${APACHE_LOG_DIR}/projects-access.log combined
</VirtualHost>
