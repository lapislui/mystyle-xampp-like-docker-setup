name: Bug Report
description: Create a report to help us improve the local stack
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please check existing issues before submitting.
  - type: input
    id: environment
    attributes:
      label: Operating System & Environment
      description: What OS and Docker version are you using?
      placeholder: e.g. Windows 11 with Docker Desktop 4.30 / macOS Sonoma / Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `.\stack.cmd up` (or `bash stack.sh up`)
        2. Open http://localhost:...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: Paste any command output, container logs, or error traces here.
      render: shell
