name: Feature Request
description: Propose a new service, feature, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Share your ideas to improve this local development environment.
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What would you like to see added or improved?
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case & Motivation
      description: Why would this be useful for local development?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've evaluated.
